apis:
- aid: netskope:rest-api-v2
  name: Netskope REST API v2
  description: >-
    Tenant-scoped REST API for retrieving events, alerts, incidents, audit logs, network and application
    telemetry, and for managing policies, IoCs, and configuration on the Netskope platform. Authenticates
    with a bearer token passed in the Netskope-Api-Token header and is provisioned via RBAC v3 service
    accounts.
  humanURL: https://docs.netskope.com/en/rest-api-v2-overview-312207/
  baseURL: https://{tenant}.goskope.com/api/v2
  tags:
  - REST
  - Event
  - Alerts
  - Policies
  - SCIM
  - ServiceAccount
  tags_raw:
  - REST
  - Events
  - Alerts
  - Policies
  - SCIM
  - Service Account
