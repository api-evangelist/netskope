aid: netskope
name: Netskope
description: >-
  Netskope is a security service edge (SSE) and SASE platform delivering
  cloud-native Secure Web Gateway, CASB, Zero Trust Network Access, data loss
  prevention, and threat protection from its NewEdge global network. The
  Netskope REST API v2 provides tenant-level programmatic access to events,
  alerts, incidents, policies, IoCs, SCIM provisioning, and configuration so
  SOC and platform teams can automate SOAR, SIEM, and IGA workflows using
  service-account bearer tokens in the Netskope-Api-Token header.
